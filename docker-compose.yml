version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - redis

  worker:
    build: ./worker1
    depends_on:
      - redis

  worker-py:
    build: ./workerPy
    depends_on:
      - redis

  realtime:
    build: ./realtime-server
    ports:
      - "3001:3001"
    depends_on:
      - redis
    environment:
      - PORT=3001

  dashboard:
    build: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      - api
      - realtime

  monitor-generator:
    build: ./monitor-generator
    depends_on:
      - redis
    restart: unless-stopped
